name: CI

on: [push, pull_request]

jobs:
  # SQLite-backed suite: typecheck, lint, build, full tests + coverage. No container —
  # the parity suite runs against :memory:, which is why this job needs nothing else.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm owns installs — the workspace is defined in pnpm-workspace.yaml,
      # which bun does not read. Installing with bun here would only pull the
      # root devDependencies and leave apps/server without hono/pino/drizzle.
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      # bun is the runtime and test runner only.
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.0

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run test:coverage

  # Fast engines on every push and PR — three parallel jobs, ~1.5-2.5 min each.
  # Each job starts its own container, applies that engine's operator schema
  # script, then runs only that engine's parity suite.
  #
  # Note: the `job` context (job.services.<id>.id) is only valid inside step `if:`
  # conditions, so nothing here execs into the service container — engine setup
  # talks to the engine over its published port instead.
  db-parity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: postgres
            image: postgres:15
            healthOptions: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
            env:
              DATABASE_URL: postgres://postgres:postgres@localhost:5432/apiconfy_test
            ddl: psql "postgres://postgres:postgres@localhost:5432/apiconfy_test" -f apps/server/src/core/db/schema/sql/postgres.sql
          - db: mariadb
            image: mariadb:10.11
            healthOptions: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 10
            env:
              DATABASE_URL: mysql://root:root@127.0.0.1:3306/apiconfy_test
            ddl: mysql --host=127.0.0.1 --port=3306 --user=root --password=root apiconfy_test < apps/server/src/core/db/schema/sql/mariadb.sql
          - db: mongodb
            image: mongo:7
            healthOptions: --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'" --health-interval 5s --health-timeout 5s --health-retries 15
            env:
              DATABASE_URL: mongodb://localhost:27017/apiconfy_test?replicaSet=rs0&directConnection=true
            # Transactions need a replica set (decision #7). Initiate it through mongosh inside
            # the running container — the driver path left the node standalone, and a standalone
            # also reports isWritablePrimary, so require setName explicitly.
            setup: |
              CID=$(docker ps -qf "ancestor=mongo:7" | head -1)
              echo "mongo container: $CID"
              docker exec "$CID" mongosh --quiet --eval "try { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) } catch (e) { print('initiate said: ' + e.message) }"
              for i in $(seq 1 30); do
                if docker exec "$CID" mongosh --quiet --eval "db.hello().setName" | grep -q rs0; then
                  echo "replica set rs0 is up after ${i} checks"
                  exit 0
                fi
                sleep 2
              done
              echo "no replica set after 60s — a standalone mongod cannot serve transactions"
              exit 1
            ddl: docker run --rm --network host -v "$PWD/apps/server/src/core/db/schema/mongodb:/schema" mongo:7 mongosh "mongodb://localhost:27017/apiconfy_test?directConnection=true" /schema/mongodb.js
    services:
      db:
        image: ${{ matrix.image }}
        options: ${{ matrix.healthOptions }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apiconfy_test
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: apiconfy_test
        ports:
          - 5432:5432   # postgres
          - 3306:3306   # mariadb
          - 27017:27017 # mongodb
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.0
      - run: pnpm install --frozen-lockfile
      - name: Engine setup
        if: matrix.setup
        run: ${{ matrix.setup }}
      - name: Apply schema (operator script — the app never creates schema)
        run: ${{ matrix.ddl }}
      - name: ${{ matrix.db }} parity suite
        working-directory: apps/server
        env: ${{ matrix.env }}
        run: bun test __tests__/db/${{ matrix.db }}-adapter.test.ts --parallel --bail

  # Heavy engines — oracle (~1.5 GB image, slow first boot) and couchbase — still as
  # parallel matrix jobs, but gated to PRs into main and to main itself, so feature
  # pushes stay fast while merges still prove every engine.
  db-parity-heavy:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: oracle
            image: gvenzl/oracle-free:23-slim
            # readiness is handled inside the DDL step below
            # No docker exec (the job context is unavailable in run steps): wait for the
            # image's own service health instead, which exercises sqlplus inside the container.
            env:
              DATABASE_URL: oracle://system:oracle@localhost:1521/FREEPDB1
            # No service health gate for Oracle (the runner gave up on it) and no docker-run
            # client (gvenzl's entrypoint starts a database): wait for readiness ourselves by
            # exec'ing sqlplus in the running container, then apply the schema there.
            ddl: |
              CID=$(docker ps -qf "ancestor=gvenzl/oracle-free:23-slim" | head -1)
              echo "oracle container: $CID"
              for i in $(seq 1 60); do
                if docker exec "$CID" bash -c "echo 'select 1 from dual;' | sqlplus -s system/oracle@//localhost:1521/FREEPDB1"; then
                  echo "oracle ready after ${i} checks"
                  break
                fi
                sleep 10
              done
              docker cp apps/server/src/core/db/schema/oracle/oracle.sql "$CID":/tmp/oracle.sql
              docker exec "$CID" sqlplus -s system/oracle@//localhost:1521/FREEPDB1 @/tmp/oracle.sql
          - db: couchbase
            image: couchbase/server:7.2.9
            env:
              DATABASE_URL: couchbase://localhost
              CB_BUCKET: apiconfy
            # clusterInit and bucket-create run through the image's own couchbase-cli, inside
            # the container: the earlier curl flow swallowed its errors, which surfaced later as
            # AuthenticationFailureError from the schema script.
            setup: |
              CID=$(docker ps -qf "ancestor=couchbase/server:7.2.9" | head -1)
              echo "couchbase container: $CID"
              for i in $(seq 1 30); do
                curl -sf http://localhost:8091/pools > /dev/null && break
                sleep 2
              done
              docker exec "$CID" couchbase-cli cluster-init \
                --cluster http://127.0.0.1:8091 \
                --cluster-username Administrator --cluster-password password \
                --cluster-ramsize 512 --cluster-index-ramsize 256 \
                --services data,index,query
              for i in $(seq 1 30); do
                if docker exec "$CID" couchbase-cli bucket-create \
                  --cluster http://127.0.0.1:8091 \
                  --username Administrator --password password \
                  --bucket apiconfy --bucket-ramsize 128 --bucket-type couchbase; then
                  break
                fi
                sleep 2
              done
              docker exec "$CID" couchbase-cli bucket-list \
                --cluster http://127.0.0.1:8091 --username Administrator --password password | grep apiconfy
            ddl: CB_URL=couchbase://localhost CB_USER=Administrator CB_PASS=password CB_BUCKET=apiconfy bun run apps/server/src/core/db/schema/couchbase/couchbase.js
    services:
      db:
        image: ${{ matrix.image }}
        options: ${{ matrix.healthOptions }}
        env:
          ORACLE_PASSWORD: oracle
          ORACLE_DATABASE: FREEPDB1
        ports:
          - 1521:1521           # oracle
          - 8091-8096:8091-8096 # couchbase: REST (8091) + query (8093) + views/analytics
          - 11210:11210         # couchbase: KV data port — the SDK cannot operate without it
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.0
      - run: pnpm install --frozen-lockfile
      - name: Engine setup
        if: matrix.setup
        run: ${{ matrix.setup }}
      - name: Apply schema (operator script — the app never creates schema)
        run: ${{ matrix.ddl }}
      - name: ${{ matrix.db }} parity suite
        working-directory: apps/server
        env: ${{ matrix.env }}
        run: bun test __tests__/db/${{ matrix.db }}-adapter.test.ts --parallel --bail
