name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm owns installs — the workspace is defined in pnpm-workspace.yaml,
      # which bun does not read. Installing with bun here would only pull the
      # root devDependencies and leave apps/server without hono/pino/drizzle.
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      # bun is the runtime and test runner only.
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.0

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run test:coverage
