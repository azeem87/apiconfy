name: CI

on: [push, pull_request]

jobs:
  # SQLite-backed suite: typecheck, lint, build, full tests + coverage. No container —
  # the parity suite runs against :memory:, which is why this job needs nothing else.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm owns installs — the workspace is defined in pnpm-workspace.yaml,
      # which bun does not read. Installing with bun here would only pull the
      # root devDependencies and leave apps/server without hono/pino/drizzle.
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      # bun is the runtime and test runner only.
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.0

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run test:coverage

  # Fast engines on every push and PR — three parallel jobs, ~1.5-2.5 min each.
  # Each job starts its own container, applies that engine's operator schema
  # script, then runs only that engine's parity suite.
  #
  # Note: the `job` context (job.services.<id>.id) is only valid inside step `if:`
  # conditions, so nothing here execs into the service container — engine setup
  # talks to the engine over its published port instead.
  db-parity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: postgres
            image: postgres:15
            healthOptions: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
            env:
              DATABASE_URL: postgres://postgres:postgres@localhost:5432/apiconfy_test
            ddl: psql "postgres://postgres:postgres@localhost:5432/apiconfy_test" -f apps/server/src/core/db/schema/sql/postgres.sql
          - db: mariadb
            image: mariadb:10.11
            healthOptions: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 10
            env:
              DATABASE_URL: mysql://root:root@127.0.0.1:3306/apiconfy_test
            ddl: mysql --host=127.0.0.1 --port=3306 --user=root --password=root apiconfy_test < apps/server/src/core/db/schema/sql/mariadb.sql
          - db: mongodb
            image: mongo:7
            healthOptions: --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'" --health-interval 5s --health-timeout 5s --health-retries 15
            env:
              DATABASE_URL: mongodb://localhost:27017/apiconfy_test?replicaSet=rs0&directConnection=true
            # Transactions need a replica set (decision #7); a standalone server fails by design.
            # Driven through the mongodb driver we already installed — no docker exec needed.
            setup: |
              cd apps/server
              bun -e '
              const { MongoClient } = await import("mongodb");
              const client = new MongoClient("mongodb://localhost:27017/?directConnection=true");
              await client.connect();
              try {
                await client.db("admin").command({
                  replSetInitiate: { _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] },
                });
              } catch {}
              for (let attempt = 0; attempt < 30; attempt += 1) {
                const hello = await client.db("admin").command({ hello: 1 });
                if (hello.isWritablePrimary) {
                  console.log("replica set primary is ready");
                  process.exit(0);
                }
                await new Promise((resolve) => setTimeout(resolve, 2000));
              }
              console.error("replica set primary never appeared");
              process.exit(1);
              '
            ddl: docker run --rm --network host -v "$PWD/apps/server/src/core/db/schema/mongodb:/schema" mongo:7 mongosh "mongodb://localhost:27017/apiconfy_test?directConnection=true" /schema/mongodb.js
    services:
      db:
        image: ${{ matrix.image }}
        options: ${{ matrix.healthOptions }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apiconfy_test
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: apiconfy_test
        ports:
          - 5432:5432   # postgres
          - 3306:3306   # mariadb
          - 27017:27017 # mongodb
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.0
      - run: pnpm install --frozen-lockfile
      - name: Engine setup
        if: matrix.setup
        run: ${{ matrix.setup }}
      - name: Apply schema (operator script — the app never creates schema)
        run: ${{ matrix.ddl }}
      - name: ${{ matrix.db }} parity suite
        working-directory: apps/server
        env: ${{ matrix.env }}
        run: bun test __tests__/db/${{ matrix.db }}-adapter.test.ts --parallel --bail

  # Heavy engines — oracle (~1.5 GB image, slow first boot) and couchbase — still as
  # parallel matrix jobs, but gated to PRs into main and to main itself, so feature
  # pushes stay fast while merges still prove every engine.
  db-parity-heavy:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: oracle
            image: gvenzl/oracle-free:23-slim
            # No docker exec (the job context is unavailable in run steps): wait for the
            # image's own service health instead, which exercises sqlplus inside the container.
            healthOptions: --health-cmd "echo 'select 1 from dual;' | sqlplus -s system/oracle@//localhost:1521/FREEPDB1" --health-interval 10s --health-timeout 10s --health-retries 30 --health-start-period 120s
            env:
              DATABASE_URL: oracle://system:oracle@localhost:1521/FREEPDB1
            ddl: docker run --rm --network host -v "$PWD/apps/server/src/core/db/schema/oracle:/schema" gvenzl/oracle-free:23-slim sqlplus -s system/oracle@//localhost:1521/FREEPDB1 @/schema/oracle.sql
          - db: couchbase
            image: couchbase:7.2
            env:
              DATABASE_URL: couchbase://localhost
              CB_BUCKET: apiconfy
            # clusterInit and bucket-create below are the same REST calls couchbase-cli makes.
            setup: |
              for i in $(seq 1 30); do
                curl -sf http://localhost:8091/pools > /dev/null && break
                sleep 2
              done
              curl -s -X POST http://localhost:8091/clusterInit \
                -d hostname=127.0.0.1 -d username=Administrator -d password=password \
                -d "services=data,index,query" \
                -d memoryQuota=256 -d indexMemoryQuota=256 -d port=SAME | head -c 200 || true
              for i in $(seq 1 30); do
                curl -sf -u Administrator:password \
                  -X POST http://localhost:8091/pools/default/buckets \
                  -d name=apiconfy -d ramQuotaMB=128 -d bucketType=couchbase -d authType=sasl \
                  > /dev/null && break
                sleep 2
              done
            ddl: CB_URL=couchbase://localhost CB_USER=Administrator CB_PASS=password CB_BUCKET=apiconfy bun run apps/server/src/core/db/schema/couchbase/couchbase.js
    services:
      db:
        image: ${{ matrix.image }}
        options: ${{ matrix.healthOptions }}
        env:
          ORACLE_PASSWORD: oracle
          ORACLE_DATABASE: FREEPDB1
        ports:
          - 1521:1521           # oracle
          - 8091-8096:8091-8096 # couchbase: REST (8091) + query (8093) + views/analytics
          - 11210:11210         # couchbase: KV data port — the SDK cannot operate without it
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.0
      - run: pnpm install --frozen-lockfile
      - name: Engine setup
        if: matrix.setup
        run: ${{ matrix.setup }}
      - name: Apply schema (operator script — the app never creates schema)
        run: ${{ matrix.ddl }}
      - name: ${{ matrix.db }} parity suite
        working-directory: apps/server
        env: ${{ matrix.env }}
        run: bun test __tests__/db/${{ matrix.db }}-adapter.test.ts --parallel --bail
